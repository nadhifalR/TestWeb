<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Enterprise | Resource Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --border-color: #e2e8f0;
            --accent-color: #2563eb;
            --sidebar-bg: #0f172a;
            --sidebar-text: #94a3b8;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color 0.2s ease, color 0.2s ease;
            -webkit-font-smoothing: antialiased;
        }

        .theme-bg { background-color: var(--bg-primary); }
        .theme-card { 
            background-color: var(--bg-secondary); 
            border: 1px solid var(--border-color);
        }
        .theme-text { color: var(--text-primary); }
        .theme-text-muted { color: var(--text-secondary); }
        .theme-border { border-color: var(--border-color); }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .page-transition {
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 { font-weight: 800; letter-spacing: -0.025em; }
        h2 { font-weight: 700; letter-spacing: -0.02em; }
        .label-caps { 
            font-size: 0.65rem; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",

    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",

    "@nivo/bar": "https://esm.sh/@nivo/bar@^0.99.0",
    "@nivo/line": "https://esm.sh/@nivo/line@^0.99.0",
    "@nivo/pie": "https://esm.sh/@nivo/pie@^0.99.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

</html>
